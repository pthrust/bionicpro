proxy_cache_path /var/cache/nginx/reports
                 levels=1:2
                 keys_zone=reports_cache:10m
                 max_size=1g
                 inactive=60m
                 use_temp_path=off;

upstream report_storage {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    location /reports/ {
        proxy_pass http://report_storage/bionicpro-reports/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache reports_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=600" always;
        add_header Content-Disposition 'attachment; filename="usage-report.csv"' always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
